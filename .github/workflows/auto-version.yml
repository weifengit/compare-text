name: 自动迭代版本并触发发布

on:
  push:
    branches: [ main ]           # 提交到 main 即自动迭代版本号并发布

concurrency:
  group: auto-version-${{ github.ref }}
  cancel-in-progress: true       # 连续快速提交时只保留最新一次，避免并发打 tag

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 打 tag
      actions: write             # gh workflow run 触发 release.yml（dispatch）

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 需要全部历史 + tags 来计算下一版本
          persist-credentials: true

      # 循环防护：HEAD 已精确对应某个版本 tag → 已处理过，直接退出
      - name: 循环防护（HEAD 已打标签）
        shell: bash
        run: |
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD 已精确打标签，跳过自动迭代"
            exit 0
          fi
          echo "HEAD 未打标签，继续"

      # 下一版本基于「最新 tag」计算（不依赖工作区文件的版本号）。
      # 默认补丁号 +1；提交信息含 [release:minor]/[release:major] 时升 minor/major。
      - name: 计算下一版本（基于最新 tag）
        id: version
        shell: bash
        run: |
          LATEST="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then
            LATEST="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            echo "未找到历史 tag，使用配置版本 $LATEST"
          else
            LATEST="${LATEST#v}"
            echo "最新 tag: v$LATEST"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -qi '\[release:major\]'; then
            NEXT="$((MAJOR+1)).0.0"
          elif echo "$MSG" | grep -qi '\[release:minor\]'; then
            NEXT="$MAJOR.$((MINOR+1)).0"
          else
            NEXT="$MAJOR.$MINOR.$((PATCH+1))"
          fi
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          echo "下一版本: v$NEXT"

      # 并发安全：tag 已存在则跳过，避免重复触发发布
      - name: 校验 tag 是否已存在
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${NEXT}" >/dev/null 2>&1; then
            echo "tag v${NEXT} 已存在，跳过"
            exit 0
          fi
          echo "tag v${NEXT} 不存在，继续"
        env:
          NEXT: ${{ env.NEXT }}

      # 关键设计：只打 tag，绝不向 main 提交/推送任何内容。
      # 因此云端 main 永远只含你自己的提交，本地永远不会冒出需要同步/合并的
      # chore(release) 提交。版本号由 release.yml 在构建时按 tag 自动对齐。
      - name: 打版本 tag 并推送
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${NEXT}" -m "chore(release): v${NEXT}"
          git push origin "v${NEXT}"
          echo "已推送 tag v${NEXT}"
        env:
          NEXT: ${{ env.NEXT }}

      # 触发三平台打包：workflow_dispatch 对 GITHUB_TOKEN 豁免，可靠触发 release.yml。
      # 无需配置 PAT（这是自动化唯一依赖的触发方式）。
      - name: 触发发布流水线（dispatch 接力）
        shell: bash
        run: |
          for i in $(seq 1 10); do
            if gh workflow run release.yml --ref "v${NEXT}" 2>/dev/null; then
              echo "已触发 release.yml（ref=v${NEXT}）"
              exit 0
            fi
            echo "等待 tag 生效重试（$i/10）..."
            sleep 3
          done
          echo "触发失败：请手动到 Actions 页面运行「构建并发布 Release」" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ env.NEXT }}
