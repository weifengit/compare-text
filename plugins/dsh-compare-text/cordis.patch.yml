# dsh-compare-text bundle patch: insert the plugin row into the profile tree.
#
# 现状（2026-10-07 调整）：本插件只保留**服务端半侧**——
#   index.js 在 DSH 启动时拉起 127.0.0.1:<port> 的 compare-text serve.js，
#   并注册同源 GET /compare-text-meta。
# 客户端里那两处界面入口（输入框/footer 浮层入口、dsh-worktable 项目卡片）
# 都已移除，见 lib/client.js 顶部说明；compare-text 的展示改由 dsh-tokensave
# 项目中心的「展示」按钮以 iframe 内嵌呈现（地址来自本项目 package.json
# 的 previewUrl，由 tokensave 的 project-info 路由读取）。
- insert:
    - id: dsh-compare-text
      name: dsh-compare-text
      config:
        # compare-text 静态服务器端口（仅 127.0.0.1；被占用则复用现有实例）。
        # 需与 compare-text 根 package.json 的 previewUrl 保持一致。
        port: 3180
