# dsh-compare-text bundle patch: insert the plugin row into the profile tree.
# The server half (index.js) starts the compare-text static server on
# 127.0.0.1 and registers /compare-text-meta; the package's dsh.client
# declaration makes lib/client.js available to the Web GUI module system.
- insert:
    - id: dsh-compare-text
      name: dsh-compare-text
      config:
        port: 3180
        # 入口样式（改完重启 dsh web 生效）：
        #   input-right  聊天输入框工具行右侧小图标（默认，最融入原生界面）
        #   input-left   聊天输入框工具行左侧小图标
        #   fab          右下角圆形悬浮按钮
        #   dock         输入框上方全宽 dock 条
        #   footer       左侧边栏底部、设置按钮旁的小图标
        entry: footer
