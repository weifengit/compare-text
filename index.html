<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件对比 · File Compare（离线）</title>
<link rel="stylesheet" href="lib/codemirror.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="appRoot">
<header class="topbar">
  <div class="tabs" id="tabs"></div>
  <button id="tabAdd" class="tab-add" type="button" title="新建对比窗口">＋</button>
  <div class="brand" title="文件对比 · 离线纯前端">
    <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M8 3h6.5L18 6.5V17a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path fill="currentColor" d="M14.5 3v4H18"/>
      <path fill="currentColor" d="M7 12h4v1.3H7V12zm0 3.2h7v1.3H7v-1.3z" opacity=".65"/>
    </svg>
    <span>文件对比</span>
  </div>
</header>

<div class="body-row">
  <aside class="sidebar" id="sidebar" aria-label="工具栏">
    <div class="sb-title">对比源</div>
    <div class="src-block">
      <input id="srcPathInput" type="text" placeholder="点击选择对比源文件夹" title="点击弹出文件夹选择" spellcheck="false" readonly>
      <button id="srcLoadBtn" class="btn" title="加载该路径下的子文件夹与文件">加载</button>
    </div>
    <div class="src-cur" id="srcPathCur">未设置对比源</div>

    <div class="sb-title">忽略选项</div>
    <div role="group" aria-label="忽略选项">
      <label class="chip" title="比较时忽略大小写"><input type="checkbox" id="optIgnoreCase" checked>忽略大小写</label>
      <label class="chip" title="统一 CRLF / LF 行结束符"><input type="checkbox" id="optIgnoreEol" checked>忽略CRLF/LF</label>
      <label class="chip" title="忽略空k、Tab 等所有空白（含行内空格）"><input type="checkbox" id="optIgnoreWhitespace" checked>忽略空格</label>
      <label class="chip" title="像处理段落一样忽略换行位置差异"><input type="checkbox" id="optIgnoreNewline" checked>忽略换行</label>
      <label class="chip" title="全角括号、冒号等视为与半角相同"><input type="checkbox" id="optIgnoreWidth" checked>忽略全/半角</label>
      <label class="chip" title="忽略括号、引号、逗号、句号、分号、百分号等标点差异"><input type="checkbox" id="optIgnorePunct" checked>忽略标点</label>
    </div>

    <div class="sb-title">历史记录</div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main class="main">
    <div class="filterbar" id="filterbar">
      <button id="sidebarToggle" class="btn fb-toggle" type="button" aria-expanded="true" aria-controls="sidebar" title="展开 / 收起侧边栏">☰</button>
      <label class="fb-item">子文件夹 <select id="dirSel" title="对比源下的子文件夹"></select></label>
      <label class="fb-item">字段 <select id="fieldSel" title="点击字段把章节文本复制到左侧编辑区"></select></label>
      <label class="fb-item">原始文件 <select id="fileSelL" title="左侧（原文）文件"></select></label>
      <label class="fb-item">修改文件 <select id="fileSelR" title="右侧（修改后）文件"></select></label>
      <div class="fb-actions">
        <button id="tidyBtn" class="btn primary" title="将两侧文本中多余的空格、制表符、换行符与空行统一整理为一行">修整</button>
        <button id="toggleEditorsBtn" class="btn" title="隐藏 / 显示主区域2（编辑区）">隐藏编辑区</button>
        <button id="foldBtn" class="btn" title="折叠 / 展开连续相同的行">折叠相同行</button>
        <button id="clearBtn" class="btn" title="清空加入比较的内容（编辑器与标注区）">清除</button>
      </div>
    </div>

    <div class="statusbar"><span id="status" role="status" aria-live="polite">在两侧粘贴文本即可自动对比</span><span id="stats" class="stats"></span></div>

    <div class="layout" id="layout">
      <div class="results" id="results"></div>
      <div class="resize-bar" id="resultsResize" title="拖动调整标注区域高度"><span class="resize-grip">⋮⋮⋮</span></div>
      <section class="editors" id="editors">
        <div class="edpane"><div class="edlabel">原文 <em>Original</em></div><textarea id="leftEd" spellcheck="false"></textarea></div>
        <div class="edpane"><div class="edlabel">修改后 <em>Modified</em></div><textarea id="rightEd" spellcheck="false"></textarea></div>
      </section>
      <div class="resize-bar" id="editorsResize" title="拖动调整编辑区与 PDF 区之间的距离"><span class="resize-grip">⋮⋮⋮</span></div>
      <div class="pdfarea" id="pdfarea">
        <div class="pdf-controls">
          <button id="pdfAuto" class="btn active" title="自动缩放：适应宽度但不超过实际大小">自动缩放</button>
          <button id="pdfFitW" class="btn" title="适应宽度">适应宽度</button>
          <button id="pdfFitP" class="btn" title="适应整页（宽高都适配）">适应页面</button>
          <button id="pdfActual" class="btn" title="实际大小 100%">实际大小</button>
          <span class="pdf-spacer"></span>
          <button id="pdfFullscreen" class="btn" title="隐藏上方区域，释放空间显示 PDF">全屏</button>
        </div>
        <div class="pdf-panels">
          <div class="pdf-panel" id="pdfLeft" title="左侧文件"></div>
          <div class="pdf-panel" id="pdfRight" title="右侧文件"></div>
        </div>
      </div>
      <div class="vsplit" id="vsplit" title="左右拖动调整列宽"><span class="vsplit-grip">⋮</span></div>
    </div>
  </main>
</div>
</div>

<!-- 对比源文件夹选择弹层 -->
<div class="picker-mask" id="pickerMask" hidden>
  <div class="picker" role="dialog" aria-label="选择对比源文件夹">
    <div class="picker-head">
      <span>选择文件夹</span>
      <button id="pickCloseBtn" class="btn" type="button" title="关闭">×</button>
    </div>
    <div class="picker-nav">
      <button id="pickerUp" class="btn" type="button" title="上一级">⬆ 上级</button>
      <input id="pickerPath" type="text" placeholder="输入或粘贴绝对路径后回车" spellcheck="false">
      <button id="pickerGo" class="btn" type="button" title="加载输入框中的路径，浏览其子文件夹">加载</button>
    </div>
    <div class="picker-body" id="pickerBody"></div>
    <div class="picker-err hidden" id="pickerErr"></div>
    <div class="picker-foot">
      <button id="pickCancelBtn" class="btn" type="button">取消</button>
      <button id="pickOkBtn" class="btn primary" type="button">选择此文件夹</button>
    </div>
  </div>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/codemirror.min.js"></script>
<script src="lib/diff.min.js"></script>
<script src="src/normalize.js"></script>
<script src="src/compute.js"></script>
<script src="src/source-api.js"></script>
<script src="src/picker.js"></script>
<script src="src/filterbar.js"></script>
<script src="src/pdfview.js"></script>
<script src="src/syncscroll.js"></script>
<script src="src/tabs.js"></script>
<script src="src/app.js"></script>
</body>
</html>
